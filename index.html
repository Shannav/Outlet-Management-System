                    className="w-80 flex flex-col transition-colors rounded-xl p-2"
                    onDragOver={handleDragOver}
                    onDragLeave={handleDragLeave}
                    onDrop={(e) => handleDrop(e, col.id)}
                 >
                    <div className="flex items-center justify-between mb-4 px-2">
                       <div className="flex items-center gap-2">
                          <Icon name="grip-vertical" className="text-gray-400 cursor-grab" />
                          <div className={`px-3 py-1 rounded-md text-sm font-semibold flex items-center gap-2 ${col.bg} ${col.color}`}>
                            <Icon name={col.icon} className="text-xs" /> {col.name}
                          </div>
                          <span className="text-gray-500 text-sm font-medium">{tasks.filter(t=>t.column===col.id).length}</span>
                       </div>
                       <div className="flex gap-1">
                          <button className="text-gray-400 hover:text-gray-600 p-1"><Icon name="ellipsis" /></button>
                          <button className="text-gray-400 hover:text-gray-600 p-1"><Icon name="plus" /></button>
                       </div>
                    </div>

                    <div className="flex-1 overflow-y-auto kanban-scroll space-y-3 px-1 pb-4">
                       {tasks.filter(t => t.column === col.id).map(task => (
                           <div 
                              key={task.id}
                              draggable
                              onDragStart={(e) => handleDragStart(e, task.id)}
                              onClick={() => setActiveModalTask(task)}
                              className={`bg-white p-4 rounded-xl border border-gray-200 cursor-grab hover:border-brand transition-colors ${draggingId === task.id ? 'opacity-50' : 'opacity-100'} shadow-sm relative group`}
                           >
                              <div className="flex justify-between items-start mb-2">
                                 <h4 className="font-semibold text-gray-900">{task.title}</h4>
                                 <button className="text-gray-400 opacity-0 group-hover:opacity-100 hover:bg-gray-100 p-1 rounded transition-opacity"><Icon name="ellipsis" /></button>
                              </div>
                              <div className="flex items-center gap-2 text-xs font-medium text-gray-500 mb-4 bg-gray-50 w-fit px-2 py-1 rounded border border-gray-100">
                                 <Icon name="chart-simple" /> {task.date}
                              </div>
                              
                              {task.progress > 0 && (
                                <div className="mb-4">
                                  <div className="flex justify-between text-xs text-gray-500 mb-1 font-medium">
                                    <span>{task.title.includes('UI') ? task.title : 'Progress'}</span>
                                    <span>{task.progress}%</span>
                                  </div>
                                  <div className="w-full h-1.5 bg-gray-100 rounded-full overflow-hidden">
                                     <div className={`h-full rounded-full ${task.progress === 100 ? 'bg-green-500' : 'bg-brand'}`} style={{ width: `${task.progress}%` }}></div>
                                  </div>
                                </div>
                              )}
                              
                              <div className="w-full h-px bg-gray-100 mb-4"></div>

                              <div className="flex justify-between items-center">
                                 <div className="flex -space-x-2">
                                     {task.assignees.map((a, i) => (
                                       <img key={i} src={`https://i.pravatar.cc/150?img=${parseInt(a)+10}`} className="w-7 h-7 rounded-full border-2 border-white relative z-[1]" alt="Avatar"/>
                                     ))}
                                 </div>
                                 <div className="flex gap-3 text-gray-400 text-xs font-medium">
                                     <div className="flex items-center gap-1"><Icon name="message" /> {task.comments}</div>
                                     <div className="flex items-center gap-1"><Icon name="link" /> {task.attachments}</div>
                                 </div>
                              </div>
                           </div>
                       ))}
                    </div>
                 </div>
               ))}
               <div className="w-10"></div>{/* Spacer */}
             </div>
          </div>

          {/* TASK MODAL (Image 4 reference) */}
          {activeModalTask && (
             <div className="fixed inset-0 bg-gray-900/40 backdrop-blur-sm z-50 flex justify-center items-center py-10" onClick={(e) => e.target === e.currentTarget && setActiveModalTask(null)}>
               <div className="bg-white rounded-2xl w-[600px] max-h-full flex flex-col shadow-2xl overflow-hidden card-shadow">
                 <div className="p-6 border-b border-gray-100 flex justify-between items-center bg-gray-50">
                   <h2 className="text-xl font-bold text-gray-900">{activeModalTask.title}</h2>
                   <div className="flex gap-2">
                     <button className="w-8 h-8 flex items-center justify-center rounded-lg text-gray-500 hover:bg-gray-200"><Icon name="star" /></button>
                     <button className="w-8 h-8 flex items-center justify-center rounded-lg text-gray-500 hover:bg-gray-200"><Icon name="link" /></button>
                     <button onClick={() => setActiveModalTask(null)} className="w-8 h-8 flex items-center justify-center rounded-lg text-gray-500 hover:bg-red-100 hover:text-red-600"><Icon name="xmark" /></button>
                   </div>
                 </div>
                 
                 <div className="p-6 overflow-y-auto">
                    <div className="grid grid-cols-[100px_1fr] gap-y-4 items-center text-sm mb-8">
                       <span className="text-gray-500 flex items-center gap-2"><Icon name="user" className="w-4" /> Assignee</span>
                       <div className="flex gap-2 items-center flex-wrap">
                          <span className="bg-blue-50 text-blue-700 px-3 py-1 rounded border border-blue-100 flex items-center gap-2">Kiara Laras <Icon name="xmark" className="cursor-pointer opacity-50 hover:opacity-100" /></span>
                          <span className="bg-green-50 text-green-700 px-3 py-1 rounded border border-green-100 flex items-center gap-2">Joe Tesla <Icon name="xmark" className="cursor-pointer opacity-50 hover:opacity-100" /></span>
                          <span className="bg-yellow-50 text-yellow-700 px-3 py-1 rounded border border-yellow-100 flex items-center gap-2">Tania <Icon name="xmark" className="cursor-pointer opacity-50 hover:opacity-100" /></span>
                          <button className="w-7 h-7 rounded border border-dashed border-gray-300 flex items-center justify-center text-gray-400 hover:bg-gray-50"><Icon name="plus" /></button>
                       </div>
                       
                       <span className="text-gray-500 flex items-center gap-2"><Icon name="tag" className="w-4" /> Tags</span>
                       <select className="border border-gray-200 rounded px-3 py-1.5 w-48 text-gray-800 bg-white shadow-sm">
                          <option>Mobile App</option>
                          <option>Website</option>
                       </select>

                       <span className="text-gray-500 flex items-center gap-2"><Icon name="circle-check" className="w-4" /> Status</span>
                       <div className="flex items-center gap-2 border border-gray-200 w-fit px-3 py-1.5 rounded bg-white shadow-sm font-medium text-gray-700"><div className="w-3 h-3 border-[3px] border-blue-500 rounded-full"></div> On Progress</div>

                       <span className="text-gray-500 flex items-center gap-2"><Icon name="calendar-days" className="w-4" /> Due date</span>
                       <input type="date" className="border border-gray-200 rounded px-3 py-1.5 w-48 text-gray-800 bg-white font-medium shadow-sm" defaultValue="2027-02-02" />

                       <span className="text-gray-500 flex items-center gap-2"><Icon name="fire" className="w-4" /> Priority</span>
                       <span className="bg-red-50 text-red-600 px-3 py-1 rounded font-medium text-xs border border-red-100 w-fit">Urgent</span>
                    </div>

                    <div className="border-b border-gray-200 flex gap-6 mb-6">
                       <button className="pb-3 text-sm font-medium text-gray-500 hover:text-gray-900 border-b-2 border-transparent">Description</button>
                       <button className="pb-3 text-sm font-bold text-gray-900 border-b-2 border-brand">Comment</button>
                       <button className="pb-3 text-sm font-medium text-gray-500 hover:text-gray-900 border-b-2 border-transparent">Setting</button>
                    </div>

                    <div className="space-y-6">
                       {/* Comment 1 */}
                       <div className="flex gap-4">
                          <img src="https://i.pravatar.cc/150?img=9" className="w-8 h-8 rounded-full" />
                          <div className="flex-1">
                             <div className="flex items-center gap-3 mb-1"><span className="font-bold text-sm text-gray-900">Kiara Laras</span><span className="text-xs text-gray-400">2 hr ago</span></div>
                             <div className="bg-gray-50 border border-gray-200 p-3 rounded-lg rounded-tl-none text-sm text-gray-800 mb-2">
                                What do you think about this style?
                                <div className="mt-2 bg-white flex items-center gap-3 p-2 rounded border border-gray-200 w-fit shadow-sm cursor-pointer hover:bg-gray-50">
                                   <Icon name="figma" className="text-purple-500 text-lg" />
                                   <div><div className="font-semibold text-xs">ABC Dashboard Style.fig</div><div className="text-[10px] text-gray-400">2.5 MB</div></div>
                                </div>
                             </div>
                             <div className="flex gap-4 text-xs font-semibold text-gray-500"><button className="hover:text-brand transition-colors">Reply</button><button className="hover:text-amber-500 transition-colors">Like</button><button className="hover:text-red-500 transition-colors">Delete</button></div>
                          </div>
                       </div>
                       {/* Comment 2 */}
                       <div className="flex gap-4 ml-10">
                          <img src="https://i.pravatar.cc/150?img=11" className="w-8 h-8 rounded-full" />
                          <div className="flex-1">
                             <div className="flex items-center gap-3 mb-1"><span className="font-bold text-sm text-gray-900">Joe Tesla</span><span className="text-xs text-gray-400">2 hr ago</span></div>
                             <div className="bg-gray-50 border border-gray-200 p-3 rounded-lg rounded-tl-none text-sm text-gray-800 mb-2">
                                That's good! but you must follow the direction, check the brief.
                                <div className="mt-2 bg-white flex items-center gap-3 p-2 rounded border border-gray-200 w-fit shadow-sm cursor-pointer hover:bg-gray-50">
                                   <Icon name="file-word" className="text-blue-500 text-lg" />
                                   <div><div className="font-semibold text-xs">Design System Guidelince.doc</div><div className="text-[10px] text-gray-400">1.5 MB</div></div>
                                </div>
                             </div>
                             <div className="flex gap-4 text-xs font-semibold text-gray-500"><button className="hover:text-brand mt-1 transition-colors">Reply</button><button className="hover:text-amber-500 mt-1 transition-colors">Like</button><button className="hover:text-red-500 mt-1 transition-colors">Delete</button></div>
                          </div>
                       </div>
                    </div>
                 </div>
                 <div className="p-4 border-t border-gray-100 bg-gray-50 flex gap-3 items-center">
                    <img src="https://i.pravatar.cc/150?img=47" className="w-8 h-8 rounded-full" />
                    <input type="text" placeholder="Add a comment... (Type here)" className="flex-1 bg-white border border-gray-200 rounded-full px-4 py-2 text-sm shadow-inner focus:outline-none focus:border-brand transition-colors" />
                 </div>
               </div>
             </div>
          )}
        </div>
      );
    };

    // --- AUTH COMPONENT ---
    const Auth = ({ onLogin }) => {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');

      const handleLogin = async (e) => {
        e.preventDefault(); setLoading(true); setError('');
        // Validate input Constraints
        if (password.length < 5) { setError("Password must be at least 5 characters."); setLoading(false); return; }
        
        try {
           // Database interaction simulated or bypassed if "admin"
           if (email === 'admin@orlando.com') {
             onLogin({ name: 'Meaghan Lownes', role: 'Sales Manager', email });
             return;
           }
           
           // Professional Error handling if not utilizing supabase auth bypass yet
           const { data, error } = await supabase.auth.signInWithPassword({ email, password });
           if(error) throw error;
           onLogin({ name: data.user.email.split('@')[0], role: 'Staff', email: data.user.email });
        } catch(err) {
           setError("Login failed. Check credentials or use 'admin@orlando.com'.");
        }
        setLoading(false);
      };

      return (
        <div className="w-full min-h-screen bg-gray-50 flex items-center justify-center p-4">
           <div className="w-full max-w-md bg-white p-8 rounded-2xl shadow-xl border border-gray-100">
              <div className="flex items-center justify-center space-x-2 mb-8 text-brand">
                 <div className="w-10 h-10 rounded-xl bg-brand flex items-center justify-center text-white"><Icon name="infinity" /></div>
                 <h1 className="text-3xl font-extrabold tracking-tight text-gray-900">Orlando<span className="text-brand">.co</span></h1>
              </div>
              <h2 className="text-2xl font-bold text-center mb-6 text-gray-800">Welcome Back</h2>
              {error && <div className="mb-4 bg-red-50 text-red-600 border border-red-200 rounded p-3 text-sm font-medium transform transition-all animate-[bounce_0.5s_ease-in-out_1]"><Icon name="circle-exclamation" className="mr-2"/>{error}</div>}
              <form onSubmit={handleLogin} className="space-y-5">
                 <div>
                    <label className="block text-sm font-medium text-gray-700 mb-1">Email / Use: admin@orlando.com</label>
                    <div className="relative">
                      <Icon name="envelope" className="absolute left-3 top-3 text-gray-400" />
                      <input type="email" required value={email} onChange={e=>setEmail(e.target.value)} className="w-full pl-10 pr-4 py-2 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand focus:border-brand transition-all text-sm bg-gray-50 focus:bg-white" placeholder="admin@orlando.com" />
                    </div>
                 </div>
                 <div>
                    <label className="block text-sm font-medium text-gray-700 mb-1">Password / Use anything</label>
                    <div className="relative">
                      <Icon name="lock" className="absolute left-3 top-3 text-gray-400" />
                      <input type="password" required minLength="5" value={password} onChange={e=>setPassword(e.target.value)} className="w-full pl-10 pr-4 py-2 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand focus:border-brand transition-all text-sm bg-gray-50 focus:bg-white" placeholder="••••••••" />
                    </div>
                 </div>
                 <button type="submit" disabled={loading} className="w-full py-2.5 rounded-lg text-white font-medium bg-brand hover:bg-[#432fd2] focus:ring-4 focus:ring-brandLight transition-colors flex items-center justify-center gap-2">
                    {loading ? <Icon name="spinner" className="animate-spin" /> : "Sign In to Dashboard"}
                 </button>
              </form>
           </div>
        </div>
      );
    };

    // --- MAIN DASHBOARD LAYOUT ---
    const MainLayout = ({ user, onLogout }) => {
       const [view, setView] = useState('kanban'); // Default to kanban mapping image 2

       return (
         <div className="min-h-screen bg-[#F8FAFC]">
            <Sidebar currentView={view} setView={setView} />
            <div className="flex flex-col flex-1 w-full">
               <TopNav user={user} onLogout={onLogout} />
               <main className="flex-1 overflow-x-hidden">
                  {view === 'dashboard' && <Dashboard />}
                  {view === 'kanban' && <Kanban />}
                  {/* Fallback for other menu items */}
                  {['staff', 'payment', 'payroll'].includes(view) && (
                     <div className="pl-64 flex flex-col items-center justify-center p-20 text-center opacity-70">
                        <Icon name="person-digging" className="text-6xl text-gray-300 mb-4" />
                        <h2 className="text-2xl font-bold text-gray-600 mb-2">Under Construction</h2>
                        <p className="text-gray-500 max-w-md">The '{view}' module is currently being built. Please check back later or use the Dashboard and Kanban pages.</p>
                     </div>
                  )}
               </main>
            </div>
         </div>
       );
    };

    // --- ROOT APP ---
    const App = () => {
      const [user, setUser] = useState(null);
      // Removed onAuthStateChange checking to ensure the simulated experience works flawlessly locally.

      if (!user) return <Auth onLogin={setUser} />;
      return <MainLayout user={user} onLogout={() => setUser(null)} />;
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
